<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizzería El Inge - Registro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center font-sans py-10">

    <div class="bg-slate-900 p-8 rounded-2xl shadow-2xl w-full max-w-md border border-slate-800">
        
        <div class="text-center mb-6">
            <h1 class="text-3xl font-extrabold tracking-tight bg-gradient-to-r from-amber-400 to-orange-500 bg-clip-text text-transparent">
                CREAR CUENTA
            </h1>
            <p class="text-slate-400 text-sm mt-2">Regístrate para realizar tus pedidos a domicilio</p>
        </div>

        <form id="formRegistro" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Nombre</label>
                <input type="text" id="nombre" required 
                    class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-amber-500 transition duration-200">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Apellido</label>
                <input type="text" id="apellido" required 
                    class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-amber-500 transition duration-200">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Correo Electrónico</label>
                <input type="email" id="correo" required 
                    class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-amber-500 transition duration-200"
                    placeholder="ejemplo@correo.com">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Contraseña</label>
                <input type="password" id="password" required 
                    class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-amber-500 transition duration-200"
                    placeholder="••••••••">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Teléfono</label>
                <input type="tel" id="telefono" required 
                    class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-amber-500 transition duration-200">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Dirección de Envío</label>
                <input type="text" id="direccion" required 
                    class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-amber-500 transition duration-200"
                    placeholder="Calle, Número, Referencia">
            </div>

            <button type="submit" 
                class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-slate-950 font-bold py-3 px-4 rounded-xl shadow-lg transition duration-150 mt-2">
                Registrarme
            </button>
        </form>

        <div class="text-center mt-6">
            <p class="text-sm text-slate-500">
                ¿Ya tienes una cuenta? 
                <a href="/login" class="text-amber-500 hover:text-amber-400 font-medium transition duration-150 ml-1">Inicia sesión aquí</a>
            </p>
        </div>
    </div>

    <script>
        document.getElementById('formRegistro').addEventListener('submit', async (e) => {
            e.preventDefault();

            const nombre = document.getElementById('nombre').value;
            const apellido = document.getElementById('apellido').value;
            const correo = document.getElementById('correo').value;
            const password = document.getElementById('password').value;
            const telefono = document.getElementById('telefono').value;
            const direccion = document.getElementById('direccion').value;

            try {
                const respuesta = await fetch('http://127.0.0.1:5000/api/registrar_cliente', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        nombre,
                        apellido,
                        correo,
                        password,
                        telefono,
                        direccion
                    })
                });

                const data = await respuesta.json();

                if (respuesta.ok) {
                    alert(data.mensaje);
                    window.location.href = '/login';
                } else {
                    alert(data.error || 'Error al registrar el cliente');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('No se pudo conectar con el servidor.');
            }
        });
    </script>
</body>
</html>
