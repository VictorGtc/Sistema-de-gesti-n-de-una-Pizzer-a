<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizzería Premium - Iniciar Sesión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ==========================================================================
           📷 CAMBIA AQUÍ LA IMAGEN DE FONDO FÁCILMENTE
           Puedes poner un enlace de internet o una ruta local como '/static/img/fondo.jpg'
           ========================================================================== */
        :root {
            --url-fondo-pizzeria: url('https://alicante.com.ar/wp-content/uploads/2022/06/iStock-1048461158-Pizza-especial-2000x1333.jpg');
        }

        .fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Capa superpuesta: Mezcla un tono rústico de horno con la foto elegida */
        .bg-pizza-overlay {
            background: linear-gradient(to bottom, rgba(28, 15, 10, 0.85), rgba(12, 6, 4, 0.92)), 
                        var(--url-fondo-pizzeria) no-repeat center center fixed;
            background-size: cover;
        }
    </style>
</head>
<body class="bg-pizza-overlay text-amber-50/90 min-h-screen flex items-center justify-center font-sans antialiased p-4 relative">

    <div id="contenedorToasts" class="fixed top-6 right-6 z-[999999] space-y-4 max-w-sm w-full pointer-events-none"></div>

    <div class="bg-white/10 backdrop-blur-xl p-8 rounded-3xl shadow-2xl w-full max-w-md border border-white/20 transition-all duration-300 hover:border-white/30 fade-in">
        
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-gradient-to-r from-red-500 to-orange-500 text-stone-950 mb-4 shadow-lg shadow-orange-500/20 text-2xl font-bold">
                <i class="fa-solid fa-fire"></i>
            </div>
            
            <h1 class="text-3xl font-black bg-gradient-to-r from-amber-400 via-orange-400 to-red-500 bg-clip-text text-transparent tracking-wider uppercase">
                Pizzería El Inge
            </h1>
            <p class="text-stone-200 text-sm mt-2 font-medium">Auténtica pizza artesanal a tu mesa</p>
        </div>

        <form id="formLogin" class="space-y-6">
            <div>
                <label class="block text-xs font-bold text-amber-400 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                    <i class="fa-solid fa-envelope text-xs opacity-80"></i> Correo Electrónico
                </label>
                <input type="email" id="correo" required 
                    placeholder="tu@correo.com"
                    class="w-full bg-stone-950/40 border border-white/20 rounded-xl px-4 py-3 text-sm text-white placeholder-stone-400 focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 transition-all duration-200 backdrop-blur-sm">
            </div>

            <div>
                <label class="block text-xs font-bold text-amber-400 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                    <i class="fa-solid fa-lock text-xs opacity-80"></i> Contraseña
                </label>
                <input type="password" id="password" required 
                    placeholder="••••••••"
                    class="w-full bg-stone-950/40 border border-white/20 rounded-xl px-4 py-3 text-sm text-white placeholder-stone-400 focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 transition-all duration-200 backdrop-blur-sm">
            </div>

            <button type="submit" 
                class="w-full bg-gradient-to-r from-red-500 via-orange-500 to-amber-500 hover:brightness-110 text-stone-950 font-black py-3.5 px-4 rounded-xl shadow-xl transform active:scale-95 transition-all duration-150 shadow-orange-500/20 tracking-wide uppercase text-xs mt-2">
                Ingresar a la Pizzería
            </button>
        </form>

        <div class="text-center mt-6">
            <p class="text-sm text-stone-300">
                ¿Primera vez que pides? 
                <a href="/registro" class="text-amber-400 hover:text-amber-300 font-bold transition duration-150 ml-1">Regístrate aquí</a>
            </p>
        </div>
    </div>

<script>
    // Función auxiliar elegante para mostrar mensajes integrados en el diseño
    function mostrarNotificacion(mensaje, tipo = 'exito') {
        const contenedor = document.getElementById('contenedorToasts');
        const toast = document.createElement('div');
        toast.className = `flex items-center gap-3 p-4 rounded-2xl border backdrop-blur-md shadow-xl transition-all duration-300 fade-in pointer-events-auto
            ${tipo === 'exito' 
                ? 'bg-emerald-500/20 border-emerald-500/30 text-emerald-200' 
                : 'bg-red-500/20 border-red-500/30 text-red-200'}`;
        
        const icono = tipo === 'exito' ? 'fa-circle-check' : 'fa-circle-exclamation';
        
        toast.innerHTML = `
            <i class="fa-solid ${icono} text-lg"></i>
            <p class="text-sm font-semibold tracking-wide">${mensaje}</p>
        `;
        
        contenedor.appendChild(toast);
    }

    document.getElementById('formLogin').addEventListener('submit', async (e) => {
        e.preventDefault();

        const correo = document.getElementById('correo').value;
        const password = document.getElementById('password').value;

        try {
            const respuesta = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ correo: correo, password: password })
            });

            const data = await respuesta.json();

            if (respuesta.ok) { 
                // Cambiado el alert antiguo por la notificación elegante
                mostrarNotificacion(`¡Bienvenido de vuelta, ${data.perfil.Nombre}!`, 'exito');

                // Guardado original de variables en localStorage intacto
                localStorage.setItem('nombre_usuario', data.perfil.Nombre);
                localStorage.setItem('correo_usuario', data.perfil.Correo);
                localStorage.setItem('rol_usuario', data.perfil.Rol);
                localStorage.setItem('tipo_usuario', data.perfil.Tipo);

                // Esperamos un momento breve (1.5 segundos) para que disfrute el mensaje visual y redirigimos sin interrupciones
                setTimeout(() => {
                    if (data.perfil.Tipo === 'cliente') {
                        localStorage.setItem('id_cliente', data.perfil.id_cliente);
                        localStorage.setItem('direccion_cliente', data.perfil.Direccion);
                        window.location.href = '/index'; 
                        return;
                    }

                    const rol = data.perfil.Rol.toLowerCase();

                    if (rol === 'admin' || rol === 'administrador') {
                        window.location.href = '/admin';
                    } else if (rol === 'cocina' || rol === 'cocinero') {
                        window.location.href = '/cocina';
                    } else if (rol === 'mesero') {
                        window.location.href = '/mesero';
                    } else if (rol === 'cajero') {
                        window.location.href = '/cajero';
                    } else {
                        window.location.href = '/index';
                    }
                }, 1500);

            } else {
                mostrarNotificacion(data.mensaje || 'Error en las credenciales', 'error');
            }

        } catch (error) {
            console.error('Error de conexión:', error);
            mostrarNotificacion('No se pudo conectar con el servidor de Flask.', 'error');
        }
    });
</script>
</body>
</html>
