<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizzería El Inge - Panel de Mesero</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --url-fondo-pizzeria: url('https://alicante.com.ar/wp-content/uploads/2022/06/iStock-1048461158-Pizza-especial-2000x1333.jpg');
        }

        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .bg-pizza-overlay {
            background: linear-gradient(to bottom, rgba(20, 10, 8, 0.92), rgba(10, 5, 4, 0.97)), 
                        var(--url-fondo-pizzeria) no-repeat center center fixed;
            background-size: cover;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-pizza-overlay text-amber-50/90 min-h-screen font-sans flex flex-col antialiased">
    <div id="contenedorToasts" class="fixed top-6 right-6 z-50 space-y-4 max-w-sm w-full pointer-events-none"></div>

    <nav class="bg-stone-950/40 backdrop-blur-md border-b border-white/10 px-6 py-4 flex justify-between items-center sticky top-0 z-40 shadow-xl">
        <div class="flex items-center gap-3">
            <div class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-gradient-to-r from-red-500 to-orange-500 text-stone-950 shadow-lg shadow-orange-500/10 text-base font-bold">
                <i class="fa-solid fa-chair"></i>
            </div>
            <h1 class="text-xl font-black tracking-wider bg-gradient-to-r from-amber-400 via-orange-400 to-red-500 bg-clip-text text-transparent uppercase">
                Panel de Mesero <span class="text-stone-400 font-medium text-xs ml-2 tracking-normal lowercase border-l border-white/20 pl-2">Atención de Mesas</span>
            </h1>
        </div>
        <button onclick="cerrarSesion()" class="text-xs bg-white/10 hover:bg-white/20 text-amber-100 hover:text-white font-bold py-2.5 px-4 rounded-xl transition-all border border-white/10 shadow-sm flex items-center gap-2 uppercase tracking-wide">
            <i class="fa-solid fa-right-from-bracket"></i> Salir
        </button>
    </nav>

    <main class="flex-1 p-6 max-w-[1400px] w-full mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Sección de Selección de Mesa -->
        <section class="lg:col-span-2 space-y-6">
            <div class="flex justify-between items-center">
                <h2 class="text-md font-bold uppercase tracking-wider text-amber-400 flex items-center gap-2.5">
                    <i class="fa-solid fa-list-ol text-orange-500"></i> Selecciona una Mesa para Tomar Pedido
                </h2>
                <span class="bg-stone-950/60 text-stone-400 text-xs px-3 py-1 rounded-full border border-white/10">
                    Límite: 15 Mesas
                </span>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4">
                <!-- Generación dinámica de 15 mesas -->
                <script>
                    for(let i=1; i<=15; i++) {
                        document.write(`
                            <div id="mesa-card-${i}" onclick="tomarPedidoMesa(${i})" 
                                class="glass-card border border-white/10 rounded-2xl p-5 hover:border-orange-500/40 hover:bg-white/10 transition-all duration-300 cursor-pointer flex flex-col items-center justify-between gap-3 text-center shadow-lg group relative overflow-hidden active:scale-95 fade-in">
                                <div class="w-12 h-12 rounded-xl bg-stone-950/50 flex items-center justify-center text-amber-400 group-hover:scale-110 transition-transform">
                                    <i class="fa-solid fa-chair text-lg"></i>
                                </div>
                                <div>
                                    <h3 class="font-extrabold text-amber-100 group-hover:text-amber-400 transition-colors text-sm">Mesa ${i}</h3>
                                    <p id="mesa-status-${i}" class="text-[10px] text-emerald-400 font-bold uppercase mt-1">Libre</p>
                                </div>
                                <button class="w-full bg-gradient-to-r from-orange-500 to-red-500 text-stone-950 font-black py-1.5 rounded-lg text-[10px] uppercase tracking-wider opacity-0 group-hover:opacity-100 transition-all duration-200 shadow-md">
                                    Atender
                                </button>
                            </div>
                        `);
                    }
                </script>
            </div>
        </section>

        <!-- Sidebar de Pedidos Activos del Mesero -->
        <section class="glass-card border border-white/10 rounded-3xl p-6 flex flex-col h-[calc(100vh-130px)] shadow-2xl sticky top-24">
            <div class="flex flex-col flex-1 min-h-0">
                <h2 class="text-md font-bold uppercase tracking-wider text-amber-400 border-b border-white/10 pb-4 flex items-center gap-2.5">
                    <i class="fa-solid fa-clock-rotate-left text-orange-500"></i> Pedidos en curso
                </h2>
                
                <div id="contenedor-pedidos-mesero" class="mt-4 space-y-3 overflow-y-auto flex-1 pr-1 custom-scrollbar">
                    <div class="text-center py-20 text-stone-400 text-xs italic">
                        <i class="fa-solid fa-pizza-slice mb-2 text-lg block opacity-40 text-amber-400"></i>
                        No hay pedidos activos en las mesas de momento.
                    </div>
                </div>
            </div>
        </section>

    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            verificarMesasOcupadas();
            setInterval(verificarMesasOcupadas, 6000);
        });

        function mostrarNotificacion(mensaje, tipo = 'exito') {
            const contenedor = document.getElementById('contenedorToasts');
            const toast = document.createElement('div');
            toast.className = `flex items-center gap-3 p-4 rounded-2xl border backdrop-blur-md shadow-xl transition-all duration-300 fade-in pointer-events-auto
                ${tipo === 'exito' ? 'bg-emerald-500/20 border-emerald-500/30 text-emerald-200' : 'bg-red-500/20 border-red-500/30 text-red-200'}`;
            
            const icono = tipo === 'exito' ? 'fa-circle-check' : 'fa-circle-exclamation';
            toast.innerHTML = `<i class="fa-solid ${icono} text-lg"></i><p class="text-sm font-semibold tracking-wide">${mensaje}</p>`;
            
            contenedor.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-10px)';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        async function verificarMesasOcupadas() {
            try {
                const respuesta = await fetch('/api/pedidos/activos');
                if (!respuesta.ok) return;
                const pedidos = await respuesta.json();
                
                // Resetear todas las mesas a libres
                for(let i=1; i<=15; i++) {
                    const statusText = document.getElementById(`mesa-status-${i}`);
                    const card = document.getElementById(`mesa-card-${i}`);
                    if(statusText) {
                        statusText.innerText = "Libre";
                        statusText.className = "text-[10px] text-emerald-400 font-bold uppercase mt-1";
                    }
                    if(card) {
                        card.classList.remove('border-amber-500/60', 'bg-amber-500/5');
                    }
                }

                const contenedorPedidos = document.getElementById('contenedor-pedidos-mesero');
                contenedorPedidos.innerHTML = '';
                let totalActivos = 0;

                pedidos.forEach(pedido => {
                    const mesa = pedido.numero_mesa;
                    // Si el pedido tiene mesa y está activo (no pagado/entregado)
                    if (mesa && mesa >= 1 && mesa <= 15) {
                        const statusText = document.getElementById(`mesa-status-${mesa}`);
                        const card = document.getElementById(`mesa-card-${mesa}`);
                        if(statusText) {
                            statusText.innerText = `Ocupada (${pedido.estado})`;
                            statusText.className = "text-[10px] text-amber-400 font-bold uppercase mt-1";
                        }
                        if(card) {
                            card.classList.add('border-amber-500/60', 'bg-amber-500/5');
                        }
                        
                        // Añadir al panel lateral
                        totalActivos++;
                        
                        let badgeColor = "bg-stone-800 text-stone-300 border-stone-700";
                        if (pedido.estado === 'Pendiente') badgeColor = "bg-purple-500/20 text-purple-300 border-purple-500/30";
                        if (pedido.estado === 'Cocinado') badgeColor = "bg-blue-500/20 text-blue-300 border-blue-500/30";
                        if (pedido.estado === 'Listo') badgeColor = "bg-emerald-500/20 text-emerald-300 border-emerald-500/30";
                        if (pedido.estado === 'Entregado') badgeColor = "bg-sky-500/20 text-sky-300 border-sky-500/30";

                        const pDiv = document.createElement('div');
                        pDiv.className = "bg-white/5 border border-white/10 rounded-2xl p-4 space-y-2 fade-in";
                        pDiv.innerHTML = `
                            <div class="flex justify-between items-center">
                                <span class="text-xs font-bold text-amber-200">Mesa ${mesa} - Orden #${pedido.id_pedido}</span>
                                <span class="px-2 py-0.5 rounded text-[10px] font-bold border uppercase ${badgeColor}">${pedido.estado}</span>
                            </div>
                            <div class="text-[11px] text-stone-400 space-y-1">
                                ${pedido.productos.map(p => `<div>• ${p.nombre_pr} <b class="text-amber-400">x${p.cantidad_v}</b></div>`).join('')}
                            </div>
                            <div class="text-xs font-bold text-amber-400 text-right pt-1 border-t border-white/5">
                                Total: $${parseFloat(pedido.total_p).toFixed(2)}
                            </div>
                        `;
                        contenedorPedidos.appendChild(pDiv);
                    }
                });

                if (totalActivos === 0) {
                    contenedorPedidos.innerHTML = `
                        <div class="text-center py-20 text-stone-400 text-xs italic">
                            <i class="fa-solid fa-pizza-slice mb-2 text-lg block opacity-40 text-amber-400"></i>
                            No hay pedidos activos en las mesas de momento.
                        </div>`;
                }

            } catch (error) {
                console.error("Error al actualizar mesas y pedidos:", error);
            }
        }

        function tomarPedidoMesa(mesa) {
            window.location.href = `/menu?mesa=${mesa}`;
        }

        function cerrarSesion() {
            localStorage.clear();
            window.location.href = '/';
        }
    </script>
</body>
</html>
