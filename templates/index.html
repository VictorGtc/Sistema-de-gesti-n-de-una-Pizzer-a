<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizzería El Inge - Menú</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .scrollbar-none::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-none {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen font-sans">

    <nav class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 px-6 py-4 flex justify-between items-center sticky top-0 z-50 transition-all duration-300">
        <h1 class="text-2xl font-extrabold bg-gradient-to-r from-amber-400 to-orange-500 bg-clip-text text-transparent hover:scale-105 transition-transform duration-200 cursor-pointer">
            PIZZERÍA EL INGE
        </h1>
        <div class="flex items-center gap-4">
            <span id="nombreUsuario" class="text-slate-300 text-sm font-medium"></span>
            <button onclick="cerrarSesion()" class="text-xs bg-slate-800 hover:bg-red-900/40 text-slate-400 hover:text-red-400 px-3 py-1.5 rounded-lg transition-all duration-200 active:scale-95">
                Salir
            </button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <div class="lg:col-span-2 space-y-8">
            <div>
                <h2 class="text-xs font-bold tracking-widest text-slate-500 uppercase mb-4">Categorías</h2>
                <div id="contenedorCategorias" class="flex gap-4 overflow-x-auto pb-2 scrollbar-none">
                    <p class="text-slate-500 text-sm">Cargando categorías...</p>
                </div>
            </div>

            <div>
                <h2 class="text-xs font-bold tracking-widest text-slate-500 uppercase mb-6" id="tituloCategoria">Productos</h2>
                <div id="contenedorMenu" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <p class="text-slate-500 text-sm">Selecciona una categoría para ver los productos.</p>
                </div>
            </div>
        </div>

        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl h-fit sticky top-24 shadow-xl transition-all duration-300 hover:border-slate-700">
            <h2 class="text-lg font-bold tracking-wide text-slate-400 uppercase mb-4 border-b border-slate-800 pb-2">Tu Pedido</h2>
            
            <div id="itemsCarrito" class="space-y-4 max-h-60 overflow-y-auto mb-4 pr-1"></div>

            <div class="border-t border-slate-800 pt-4 space-y-4">
                <div class="flex justify-between items-center font-bold text-lg">
                    <span>Total:</span>
                    <span id="totalCarrito" class="text-amber-400 font-extrabold text-2xl animate-pulse">$0.00</span>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Dirección de Entrega</label>
                    <textarea id="direccionEntrega" rows="2" required
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-all duration-200 resize-none"></textarea>
                </div>

                <button id="btnFinalizar" onclick="enviarPedido()" disabled
                    class="w-full bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 font-bold py-3 px-4 rounded-xl shadow-lg opacity-50 cursor-not-allowed transform active:scale-95 transition-all duration-150 shadow-amber-500/10">
                    Confirmar Pedido
                </button>
            </div>
        </div>

    </main>

    <script>
        let carrito = [];
        let listaCategorias = [];
        let listaProductos = [];
        let categoriaSeleccionada = null;
        
        const idCliente = localStorage.getItem('id_cliente')    ;


        if (!idCliente) {
            window.location.href = '/login';
        }


        document.getElementById('nombreUsuario').innerText = `Hola, ${localStorage.getItem('nombre_cliente') || 'Cliente'}`;
        document.getElementById('direccionEntrega').value = localStorage.getItem('direccion_cliente') || '';

        // ==========================================
        // CONSTANTES PARA SERVIDORES DE IMÁGENES LOCALES
        // ==========================================
        const RUTA_IMG_CATEGORIAS = '/static/uploads/categorias/';
        const RUTA_IMG_PRODUCTOS = '/static/uploads/productos/';

        // ==========================================
        // LLAMADAS AL BACKEND (FETCH DINÁMICOS)
        // ==========================================
        
        async function cargarDatosIniciales() {
            try {

                const resCat = await fetch('http://127.0.0.1:5000/api/obtener_categorias');
                if (!resCat.ok) throw new Error('Error al obtener categorías');
                listaCategorias = await resCat.json();


                const resProd = await fetch('http://127.0.0.1:5000/api/obtener_productos');
                if (!resProd.ok) throw new Error('Error al obtener productos');
                listaProductos = await resProd.json();

                if (listaCategorias.length > 0) {

                    categoriaSeleccionada = listaCategorias[0].id_categoria;
                    renderizarCategorias();
                    renderizarProductos();
                }

            } catch (error) {
                console.error('Error de carga de catálogo:', error);
                document.getElementById('contenedorCategorias').innerHTML = `<p class="text-red-400 text-sm">No se pudo conectar con el catálogo.</p>`;
            }
        }

        // ==========================================
        // RENDERIZADO DE INTERFAZ GRÁFICA
        // ==========================================

        function renderizarCategorias() {
            const contenedor = document.getElementById('contenedorCategorias');
            contenedor.innerHTML = '';
            
            listaCategorias.forEach(cat => {
                const esActiva = cat.id_categoria === categoriaSeleccionada;

                const srcImagen = `${RUTA_IMG_CATEGORIAS}${cat.imagen_c}`;

                contenedor.innerHTML += `
                    <button onclick="seleccionarCategoria(${cat.id_categoria})" 
                        class="flex items-center gap-3 px-5 py-3 rounded-xl border text-sm font-bold transition-all duration-300 whitespace-nowrap active:scale-95
                        ${esActiva ? 'bg-gradient-to-r from-amber-500 to-orange-500 border-transparent text-slate-950 shadow-lg shadow-amber-500/20' : 'bg-slate-900 border-slate-800 text-slate-400 hover:border-slate-700 hover:text-white'}">
                        <img src="${srcImagen}" alt="${cat.nombre_c}" class="w-6 h-6 object-cover rounded-md ${esActiva ? 'brightness-0' : ''}" 
                            onerror="this.src='https://cdn-icons-png.flaticon.com/512/6978/6978255.png'">
                        ${cat.nombre_c}
                    </button>
                `;
            });
        }

        function seleccionarCategoria(id_cat) {
            categoriaSeleccionada = id_cat;
            renderizarCategorias();
            renderizarProductos();
        }

        function renderizarProductos() {
            const contenedor = document.getElementById('contenedorMenu');
            contenedor.innerHTML = '';
            
            const filtrados = listaProductos.filter(p => p.id_categoria === categoriaSeleccionada);
            const catActual = listaCategorias.find(c => c.id_categoria === categoriaSeleccionada);
            
            document.getElementById('tituloCategoria').innerText = catActual ? `Menú de ${catActual.nombre_c}` : 'Productos';

            if(filtrados.length === 0) {
                contenedor.innerHTML = `<p class="text-slate-500 text-sm col-span-2">No hay productos disponibles en esta categoría por el momento.</p>`;
                return;
            }

            filtrados.forEach(p => {

                const srcImagen = `${RUTA_IMG_PRODUCTOS}${p.imagen_pr}`;

                contenedor.innerHTML += `
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden flex flex-col justify-between hover:border-amber-500/40 hover:shadow-xl hover:shadow-amber-500/5 transition-all duration-300 transform hover:-translate-y-1 fade-in">
                        <div class="relative h-44 bg-slate-950 overflow-hidden">
                            <img src="${srcImagen}" alt="${p.nombre_pr}" class="w-full h-full object-cover transition-transform duration-500 hover:scale-110" 
                                onerror="this.src='https://images.unsplash.com/photo-1513104890138-7c749659a591?q=80&w=400'">
                        </div>
                        <div class="p-5 flex-1 flex flex-col justify-between">
                            <div>
                                <h3 class="text-lg font-bold text-white mb-1 hover:text-amber-400 transition-colors">${p.nombre_pr}</h3>
                                <p class="text-slate-400 text-xs leading-relaxed">${p.descripcion || 'Sin descripción disponible.'}</p>
                            </div>
                            <div class="flex justify-between items-center mt-6">
                                <span class="text-xl font-extrabold text-amber-400">$${parseFloat(p.precio_pr).toFixed(2)}</span>
                                <button onclick="agregarAlCarrito(${p.id_producto}, '${p.nombre_pr}', ${parseFloat(p.precio_pr)})" 
                                    class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-4 py-2 rounded-xl text-sm transition-all duration-200 active:scale-95 shadow-md hover:shadow-lg shadow-amber-500/10">
                                    Agregar
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // ==========================================
        // GESTIÓN DEL CARRITO DE COMPRAS
        // ==========================================

        function agregarAlCarrito(id_producto, nombre, precio) {
            const existe = carrito.find(item => item.id_producto === id_producto);
            if (existe) {
                existe.cantidad++;
            } else {
                carrito.push({ id_producto, nombre, precio, cantidad: 1 });
            }
            renderizarCarrito();
        }

        function modificarCantidad(id_producto, cambio) {
            const item = carrito.find(item => item.id_producto === id_producto);
            if (item) {
                item.cantidad += cambio;
                if (item.cantidad <= 0) {
                    carrito = carrito.filter(i => i.id_producto !== id_producto);
                }
            }
            renderizarCarrito();
        }

        function renderizarCarrito() {
            const contenedor = document.getElementById('itemsCarrito');
            const totalTxt = document.getElementById('totalCarrito');
            const btn = document.getElementById('btnFinalizar');
            
            contenedor.innerHTML = '';
            let total = 0;

            if (carrito.length === 0) {
                contenedor.innerHTML = '<p class="text-slate-500 text-sm text-center py-4 fade-in">El carrito está vacío.</p>';
                btn.disabled = true;
                btn.classList.add('opacity-50', 'cursor-not-allowed');
            } else {
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
            }

            carrito.forEach(item => {
                total += item.precio * item.cantidad;
                contenedor.innerHTML += `
                    <div class="flex justify-between items-center bg-slate-950 p-3 rounded-xl border border-slate-800 fade-in">
                        <div>
                            <h4 class="text-sm font-bold text-white">${item.nombre}</h4>
                            <p class="text-xs text-slate-400">$${item.precio.toFixed(2)} x ${item.cantidad}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="modificarCantidad(${item.id_producto}, -1)" class="bg-slate-800 text-white w-6 h-6 rounded flex items-center justify-center hover:bg-slate-700 font-bold transition">-</button>
                            <span class="text-sm font-semibold">${item.cantidad}</span>
                            <button onclick="modificarCantidad(${item.id_producto}, 1)" class="bg-slate-800 text-white w-6 h-6 rounded flex items-center justify-center hover:bg-slate-700 font-bold transition">+</button>
                        </div>
                    </div>
                `;
            });

            totalTxt.innerText = `$${total.toFixed(2)}`;
        }

        // ==========================================
        // ENVÍO DE PEDIDOS Y CIERRE DE SESIÓN
        // ==========================================

        async function enviarPedido() {
            const direccion = document.getElementById('direccionEntrega').value;
            if (!direccion.trim()) {
                alert('Por favor introduce una dirección válida de entrega.');
                return;
            }

            const productosPayload = carrito.map(item => ({
                id_producto: item.id_producto,
                cantidad: item.cantidad,
                precio_unitario: item.precio
            }));
            const idSesion = localStorage.getItem('id_cliente');
            try {
                const respuesta = await fetch('http://127.0.0.1:5000/api/pedido_domicilio', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        id_cliente: idSesion ? parseInt(idSesion) : null,
                        id_usuario: null,
                        productos: productosPayload
                    })
                });

                const data = await respuesta.json();

                if (respuesta.ok) {
                    alert('¡Pedido realizado con éxito! Tu pizza va en camino.');
                    carrito = [];
                    renderizarCarrito();
                } else {
                    alert(data.error || 'Hubo un problema al procesar tu orden.');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('No se pudo establecer conexión con el servidor.');
            }
        }

        function cerrarSesion() {
            localStorage.clear();
            window.location.href = '/login';
        }

        renderizarCarrito();
        cargarDatosIniciales();
    </script>
</body>
</html>
