<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizzería El Inge - Panel de Cocina</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen font-sans">

    <nav class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <div class="w-3 h-3 bg-green-500 rounded-full animate-ping"></div>
            <h1 class="text-xl font-extrabold tracking-wide text-slate-200">
                MONITOR DE COCINA <span class="text-amber-400 font-medium text-sm ml-2">| Pizzería El Inge</span>
            </h1>
        </div>
        <button onclick="actualizarTablero()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-xl text-sm font-medium border border-slate-700 transition-all flex items-center gap-2 active:scale-95">
            🔄 Actualizar Panel
        </button>
    </nav>

    <main class="p-6 max-w-[1600px] mx-auto">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="bg-slate-900/50 border border-slate-800 p-4 rounded-2xl flex justify-between items-center">
                <div>
                    <p class="text-slate-400 text-xs font-semibold uppercase tracking-wider">Pendientes</p>
                    <h3 class="text-2xl font-black text-amber-500 mt-1" id="contadorPendientes">0</h3>
                </div>
                <div class="w-10 h-10 bg-amber-500/10 rounded-xl flex items-center justify-center text-amber-500 text-lg">⏳</div>
            </div>
            <div class="bg-slate-900/50 border border-slate-800 p-4 rounded-2xl flex justify-between items-center">
                <div>
                    <p class="text-slate-400 text-xs font-semibold uppercase tracking-wider">En Cocina</p>
                    <h3 class="text-2xl font-black text-blue-500 mt-1" id="contadorProgreso">0</h3>
                </div>
                <div class="w-10 h-10 bg-blue-500/10 rounded-xl flex items-center justify-center text-blue-500 text-lg">🔥</div>
            </div>
            <div class="bg-slate-900/50 border border-slate-800 p-4 rounded-2xl flex justify-between items-center">
                <div>
                    <p class="text-slate-400 text-xs font-semibold uppercase tracking-wider">Listos para Despacho</p>
                    <h3 class="text-2xl font-black text-emerald-500 mt-1" id="contadorListos">0</h3>
                </div>
                <div class="w-10 h-10 bg-emerald-500/10 rounded-xl flex items-center justify-center text-emerald-500 text-lg">🍕</div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
            
            <div class="bg-slate-900/40 border border-slate-900 rounded-2xl p-4 min-h-[600px]">
                <div class="flex items-center gap-2 mb-4 pb-2 border-b border-slate-800/60">
                    <span class="w-2 h-2 rounded-full bg-amber-500"></span>
                    <h2 class="font-bold text-slate-300 tracking-wide uppercase text-sm">Órdenes Entrantes</h2>
                </div>
                <div id="columnaPendientes" class="space-y-4"></div>
            </div>

            <div class="bg-slate-900/40 border border-slate-900 rounded-2xl p-4 min-h-[600px]">
                <div class="flex items-center gap-2 mb-4 pb-2 border-b border-slate-800/60">
                    <span class="w-2 h-2 rounded-full bg-blue-500"></span>
                    <h2 class="font-bold text-slate-300 tracking-wide uppercase text-sm">En Preparación</h2>
                </div>
                <div id="columnaProgreso" class="space-y-4"></div>
            </div>

            <div class="bg-slate-900/40 border border-slate-900 rounded-2xl p-4 min-h-[600px]">
                <div class="flex items-center gap-2 mb-4 pb-2 border-b border-slate-800/60">
                    <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                    <h2 class="font-bold text-slate-300 tracking-wide uppercase text-sm">Listos / Esperando Entrega</h2>
                </div>
                <div id="columnaListos" class="space-y-4"></div>
            </div>

        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            actualizarTablero();
            // Polling automático cada 15 segundos para refrescar la cocina en tiempo real
            setInterval(actualizarTablero, 15000);
        });

        async function actualizarTablero() {
            try {
                const respuesta = await fetch('http://127.0.0.1:5000/api/obtener_pedido');
                const pedidos = await respuesta.json();

                const colPendientes = document.getElementById('columnaPendientes');
                const colProgreso = document.getElementById('columnaProgreso');
                const colListos = document.getElementById('columnaListos');

                // Limpiar columnas antiguas
                colPendientes.innerHTML = '';
                colProgreso.innerHTML = '';
                colListos.innerHTML = '';

                let cPendientes = 0, cProgreso = 0, cListos = 0;

                if (Array.isArray(pedidos)) {
                    pedidos.forEach(pedido => {
                        const tarjetaHTML = crearTarjetaPedido(pedido);

                        if (pedido.estado === 'Pendiente') {
                            colPendientes.innerHTML += tarjetaHTML;
                            cPendientes++;
                        } else if (pedido.estado === 'Cocinando') {
                            colProgreso.innerHTML += tarjetaHTML;
                            cProgreso++;
                        } else if (pedido.estado === 'Listo') {
                            colListos.innerHTML += tarjetaHTML;
                            cListos++;
                        }
                    });
                }

                mostrarContadores(cPendientes, cProgreso, cListos);

            } catch (error) {
                console.error("Error al cargar pedidos en el monitor:", error);
            }
        }

        function crearTarjetaPedido(pedido) {
            let itemsHTML = '';
            pedido.productos.forEach(prod => {
                itemsHTML += `
                    <div class="flex justify-between items-center text-sm bg-slate-950/40 p-2 rounded-lg border border-slate-850">
                        <span class="text-slate-200 font-medium">${prod.nombre_pr}</span>
                        <span class="bg-slate-800 text-amber-400 font-bold px-2 py-0.5 rounded text-xs">x${prod.cantidad_v}</span>
                    </div>
                `;
            });

            // Formatear hora de la orden
            const horaOrden = pedido.fecha_p ? new Date(pedido.fecha_p).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '--:--';

            let botonAccion = '';
            let colorBorde = 'border-amber-500/30';

            if (pedido.estado === 'Pendiente') {
                colorBorde = 'border-amber-600/30 hover:border-amber-500/60';
                botonAccion = `
                    <button onclick="cambiarEstado(${pedido.id_pedido}, 'Cocinando')" class="w-full mt-4 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-2.5 rounded-xl text-xs uppercase tracking-wider transition-all active:scale-[0.98]">
                        👨‍🍳 Empezar Cocina
                    </button>
                `;
            } else if (pedido.estado === 'Cocinando') {
                colorBorde = 'border-blue-600/30 hover:border-blue-500/60';
                botonAccion = `
                    <button onclick="cambiarEstado(${pedido.id_pedido}, 'Listo')" class="w-full mt-4 bg-blue-500 hover:bg-blue-600 text-white font-bold py-2.5 rounded-xl text-xs uppercase tracking-wider transition-all active:scale-[0.98]">
                        🍕 Terminar Orden
                    </button>
                `;
            } else if (pedido.estado === 'Listo') {
                colorBorde = 'border-emerald-600/30 hover:border-emerald-500/60';
                botonAccion = `
                    <button onclick="cambiarEstado(${pedido.id_pedido}, 'Entregado')" class="w-full mt-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl text-xs uppercase tracking-wider transition-all active:scale-[0.98]">
                        📦 Despachar / Entregar
                    </button>
                `;
            }

            return `
                <div class="bg-slate-900 border ${colorBorde} p-4 rounded-2xl shadow-xl fade-in transition-all duration-300">
                    <div class="flex justify-between items-start border-b border-slate-800/80 pb-3 mb-3">
                        <div>
                            <span class="text-xs font-bold text-slate-500 uppercase tracking-widest">Orden #${pedido.id_pedido}</span>
                            <h4 class="text-base font-black text-slate-100 mt-0.5">${pedido.origen_pedido}</h4>
                        </div>
                        <span class="text-xs text-slate-400 bg-slate-950 px-2 py-1 rounded-lg font-mono border border-slate-850">${horaOrden}</span>
                    </div>

                    <div class="space-y-2">
                        <p class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1">Detalle:</p>
                        <div class="max-h-[160px] overflow-y-auto space-y-1.5 pr-1 scrollbar-none">
                            ${itemsHTML}
                        </div>
                    </div>

                    ${botonAccion}
                </div>
            `;
        }

        async function cambiarEstado(idPedido, nuevoEstado) {
            try {
                // CORRECCIÓN: Apunta a la URL exacta definida en tu backend de Flask (/api/actualizar_estado)
                const respuesta = await fetch('http://127.0.0.1:5000/api/actualizar_estado', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        id_pedido: idPedido,
                        nuevo_estado: nuevoEstado
                    })
                });

                if (respuesta.ok) {
                    actualizarTablero();
                } else {
                    alert("No se pudo actualizar el estado de la orden.");
                }
            } catch (error) {
                console.error("Error al actualizar estado:", error);
                alert("Error de conexión con el servidor.");
            }
        }

        function mostrarContadores(p, pr, l) {
            document.getElementById('contadorPendientes').innerText = p;
            document.getElementById('contadorProgreso').innerText = pr;
            document.getElementById('contadorListos').innerText = l;
        }
    </script>
</body>
</html>
