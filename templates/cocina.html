<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizzería El Inge - Panel de Cocina</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen font-sans">
    <div id="contenedorToasts" class="fixed top-6 right-6 z-[999999] space-y-4 max-w-sm w-full pointer-events-none"></div>

    <nav class="bg-slate-900/75 backdrop-blur-md border-b border-slate-700/50 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <div class="w-3 h-3 bg-green-500 rounded-full animate-ping"></div>
            <h1 class="text-xl font-extrabold tracking-wide text-slate-100">
                MONITOR DE COCINA <span class="text-amber-400 font-medium text-sm ml-2">| Pizzería El Inge</span>
            </h1>
        </div>
        <button onclick="actualizarTablero()" class="bg-slate-700/60 hover:bg-slate-600/70 text-slate-100 px-4 py-2 rounded-xl text-sm font-medium border border-slate-600/40 backdrop-blur-sm transition-all flex items-center gap-2 active:scale-95">
            🔄 Actualizar Panel
        </button>
    </nav>

    <main class="p-6 max-w-[1600px] mx-auto">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="bg-slate-900/35 border border-slate-700/40 backdrop-blur-md p-4 rounded-2xl flex justify-between items-center shadow-lg">
                <div>
                    <p class="text-slate-300 text-xs font-semibold uppercase tracking-wider">Pendientes</p>
                    <h3 class="text-2xl font-black text-amber-400 mt-1" id="contadorPendientes">0</h3>
                </div>
                <div class="w-10 h-10 bg-amber-500/20 rounded-xl flex items-center justify-center text-amber-400 text-lg">⏳</div>
            </div>
            <div class="bg-slate-900/35 border border-slate-700/40 backdrop-blur-md p-4 rounded-2xl flex justify-between items-center shadow-lg">
                <div>
                    <p class="text-slate-300 text-xs font-semibold uppercase tracking-wider">En Cocina</p>
                    <h3 class="text-2xl font-black text-blue-400 mt-1" id="contadorProgreso">0</h3>
                </div>
                <div class="w-10 h-10 bg-blue-500/20 rounded-xl flex items-center justify-center text-blue-400 text-lg">🔥</div>
            </div>
            <div class="bg-slate-900/35 border border-slate-700/40 backdrop-blur-md p-4 rounded-2xl flex justify-between items-center shadow-lg">
                <div>
                    <p class="text-slate-300 text-xs font-semibold uppercase tracking-wider">Listos para Despacho</p>
                    <h3 class="text-2xl font-black text-emerald-400 mt-1" id="contadorListos">0</h3>
                </div>
                <div class="w-10 h-10 bg-emerald-500/20 rounded-xl flex items-center justify-center text-emerald-400 text-lg">🍕</div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
            
            <div class="bg-slate-900/20 border border-slate-700/30 backdrop-blur-md rounded-2xl p-4 min-h-[600px] shadow-inner">
                <div class="flex items-center gap-2 mb-4 pb-2 border-b border-slate-700/40">
                    <span class="w-2 h-2 rounded-full bg-amber-500"></span>
                    <h2 class="font-bold text-slate-100 tracking-wide uppercase text-sm">Órdenes Entrantes</h2>
                </div>
                <div id="columnaPendientes" class="space-y-4"></div>
            </div>

            <div class="bg-slate-900/20 border border-slate-700/30 backdrop-blur-md rounded-2xl p-4 min-h-[600px] shadow-inner">
                <div class="flex items-center gap-2 mb-4 pb-2 border-b border-slate-700/40">
                    <span class="w-2 h-2 rounded-full bg-blue-500"></span>
                    <h2 class="font-bold text-slate-100 tracking-wide uppercase text-sm">En Preparación</h2>
                </div>
                <div id="columnaProgreso" class="space-y-4"></div>
            </div>

            <div class="bg-slate-900/20 border border-slate-700/30 backdrop-blur-md rounded-2xl p-4 min-h-[600px] shadow-inner">
                <div class="flex items-center gap-2 mb-4 pb-2 border-b border-slate-700/40">
                    <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                    <h2 class="font-bold text-slate-100 tracking-wide uppercase text-sm">Listos / Esperando Entrega</h2>
                </div>
                <div id="columnaListos" class="space-y-4"></div>
            </div>

        </div>
    </main>

    <script>
        function mostrarNotificacion(mensaje, tipo = 'exito') {
            const contenedor = document.getElementById('contenedorToasts');
            if (!contenedor) return;
            const toast = document.createElement('div');
            toast.className = `flex items-center gap-3 p-4 rounded-2xl border backdrop-blur-md shadow-xl transition-all duration-300 fade-in pointer-events-auto
                ${tipo === 'exito' 
                    ? 'bg-emerald-500/20 border-emerald-500/30 text-emerald-200' 
                    : 'bg-red-500/20 border-red-500/30 text-red-200'}`;
            
            const icono = tipo === 'exito' ? 'fa-circle-check' : 'fa-circle-exclamation';
            
            toast.innerHTML = `
                <i class="fa-solid ${icono} text-lg"></i>
                <p class="text-sm font-semibold tracking-wide">${mensaje}</p>
            `;
            
            contenedor.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-10px)';
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        document.addEventListener('DOMContentLoaded', () => {
            actualizarTablero();
            // Polling automático cada 15 segundos para refrescar la cocina en tiempo real
            setInterval(actualizarTablero, 15000);
        });

        async function actualizarTablero() {
            try {
                const respuesta = await fetch('http://127.0.0.1:5000/api/obtener_pedido');
                const pedidos = await respuesta.json();

                const colPendientes = document.getElementById('columnaPendientes');
                const colProgreso = document.getElementById('columnaProgreso');
                const colListos = document.getElementById('columnaListos');

                // Limpiar columnas antiguas
                colPendientes.innerHTML = '';
                colProgreso.innerHTML = '';
                colListos.innerHTML = '';

                let cPendientes = 0, cProgreso = 0, cListos = 0;

                if (Array.isArray(pedidos)) {
                    pedidos.forEach(pedido => {
                        const tarjetaHTML = crearTarjetaPedido(pedido);

                        if (pedido.estado === 'Pendiente') {
                            colPendientes.innerHTML += tarjetaHTML;
                            cPendientes++;
                        } else if (pedido.estado === 'Cocinado') {
                            colProgreso.innerHTML += tarjetaHTML;
                            cProgreso++;
                        } else if (pedido.estado === 'Listo') {
                            colListos.innerHTML += tarjetaHTML;
                            cListos++;
                        }
                    });
                }

                mostrarContadores(cPendientes, cProgreso, cListos);

            } catch (error) {
                console.error("Error al cargar pedidos en el monitor:", error);
            }
        }

        function crearTarjetaPedido(pedido) {
            let itemsHTML = '';
            pedido.productos.forEach(prod => {
                itemsHTML += `
                    <div class="flex justify-between items-center text-sm bg-slate-950/30 p-2 rounded-lg border border-slate-700/30">
                        <span class="text-slate-100 font-medium">${prod.nombre_pr}</span>
                        <span class="bg-slate-800 text-amber-400 font-bold px-2 py-0.5 rounded text-xs border border-slate-600/30">x${prod.cantidad_v}</span>
                    </div>
                `;
            });

            // Formatear hora de la orden
            const horaOrden = pedido.fecha_p ? new Date(pedido.fecha_p).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '--:--';

            let botonAccion = '';
            let colorBorde = 'border-amber-500/30';

            if (pedido.estado === 'Pendiente') {
                colorBorde = 'border-amber-500/30 hover:border-amber-500/60 bg-amber-500/[0.03]';
                botonAccion = `
                    <button onclick="cambiarEstado(${pedido.id_pedido}, 'Cocinado')" class="w-full mt-4 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-2.5 rounded-xl text-xs uppercase tracking-wider transition-all active:scale-[0.98] shadow-md shadow-amber-500/20">
                        👨‍🍳 Empezar Cocina
                    </button>
                `;
            } else if (pedido.estado === 'Cocinado') {
                colorBorde = 'border-blue-500/30 hover:border-blue-500/60 bg-blue-500/[0.03]';
                botonAccion = `
                    <button onclick="cambiarEstado(${pedido.id_pedido}, 'Listo')" class="w-full mt-4 bg-blue-500 hover:bg-blue-600 text-white font-bold py-2.5 rounded-xl text-xs uppercase tracking-wider transition-all active:scale-[0.98] shadow-md shadow-blue-500/20">
                        🍕 Terminar Orden
                    </button>
                `;
            } else if (pedido.estado === 'Listo') {
                colorBorde = 'border-emerald-500/30 hover:border-emerald-500/60 bg-emerald-500/[0.03]';
                botonAccion = `
                    <button onclick="cambiarEstado(${pedido.id_pedido}, 'Entregado')" class="w-full mt-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl text-xs uppercase tracking-wider transition-all active:scale-[0.98] shadow-md shadow-emerald-500/20">
                        📦 Despachar / Entregar
                    </button>
                `;
            }

            return `
                <div class="bg-slate-900/40 border ${colorBorde} p-4 rounded-2xl shadow-lg backdrop-blur-md fade-in transition-all duration-300">
                    <div class="flex justify-between items-start border-b border-slate-700/40 pb-3 mb-3">
                        <div>
                            <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">Orden #${pedido.id_pedido}</span>
                            <h4 class="text-base font-black text-slate-50 mt-0.5">${pedido.origen_pedido}</h4>
                        </div>
                        <span class="text-xs text-slate-300 bg-slate-950/40 px-2 py-1 rounded-lg font-mono border border-slate-700/40">${horaOrden}</span>
                    </div>

                    <div class="space-y-2">
                        <p class="text-[11px] font-bold text-slate-300 uppercase tracking-wider mb-1">Detalle:</p>
                        <div class="max-h-[160px] overflow-y-auto space-y-1.5 pr-1 scrollbar-none">
                            ${itemsHTML}
                        </div>
                    </div>

                    ${botonAccion}
                </div>
            `;
        }

        async function cambiarEstado(idPedido, nuevoEstado) {
            try {
                const respuesta = await fetch('http://127.0.0.1:5000/api/actualizar_estado', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        id_pedido: idPedido,
                        nuevo_estado: nuevoEstado
                    })
                });

                if (respuesta.ok) {
                    actualizarTablero();
                } else {
                    mostrarNotificacion("No se pudo actualizar el estado de la orden.", "error");
                }
            } catch (error) {
                console.error("Error al actualizar estado:", error);
                mostrarNotificacion("Error de conexión con el servidor.", "error");
            }
        }

        function mostrarContadores(p, pr, l) {
            document.getElementById('contadorPendientes').innerText = p;
            document.getElementById('contadorProgreso').innerText = pr;
            document.getElementById('contadorListos').innerText = l;
        }
    </script>
</body>
</html>
